apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kcca-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: kcca.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kcca-frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: kcca-backend
                port:
                  number: 5000
