apiVersion: apps/v1
kind: Deployment
metadata:
  name: kcca-frontend
  labels:
    app: kcca-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kcca-frontend
  template:
    metadata:
      labels:
        app: kcca-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/YOUR_ORG/kcca-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
