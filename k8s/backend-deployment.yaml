apiVersion: apps/v1
kind: Deployment
metadata:
  name: kcca-backend
  labels:
    app: kcca-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kcca-backend
  template:
    metadata:
      labels:
        app: kcca-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/YOUR_ORG/kcca-backend:latest
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: kcca-backend-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
